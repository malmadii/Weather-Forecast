name: CD - Deploy to Azure Web App (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1️⃣ Login to Azure using the Service Principal
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 2️⃣ Build Docker image using your Dockerfile
    - name: Build Docker Image
      run: docker build -t weather-dashboard:latest .

    # 3️⃣ Deploy the Docker image to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        images: weather-dashboard:latest
